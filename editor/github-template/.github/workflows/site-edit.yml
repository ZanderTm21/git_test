# Runs Claude Code (on the Claude subscription, not API tokens) for each change request sent from the site editor.
# Claude only edits files under site/ and writes its reply; the steps after it commit, comment and close the issue.
name: Site edit

on:
  issues:
    types: [opened]

concurrency:
  group: site-edit
  cancel-in-progress: false

jobs:
  edit:
    # Only requests the editor created (labelled, opened by the repository owner's token).
    if: contains(github.event.issue.labels.*.name, 'site-edit') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-draft
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        run: |
          npm install -g @anthropic-ai/claude-code
          python3 -m pip install --quiet pillow

      - name: Save the request
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > .request.md

      - name: Claude edits the site
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "Handle the change request in .request.md by following CLAUDE.md. Write your reply to the team member in .reply.md." \
            --allowedTools "Read" "Edit" "Write" "Glob" "Grep" "Bash(python3 tools/edit_image.py:*)" \
            --permission-mode dontAsk \
            --no-session-persistence \
            --output-format text > .claude-log.txt
          test -s .reply.md || echo "Done." > .reply.md

      - name: Save the changes
        run: |
          git config user.name "site-editor-bot"
          git config user.email "site-editor-bot@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "No file changes."
          else
            git commit -m "Site edit #${{ github.event.issue.number }}"
            git push origin HEAD:site-draft
          fi

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { cat .reply.md; printf '\n\n<!-- site-edit:done -->\n'; } > .comment.md
          gh issue comment ${{ github.event.issue.number }} --body-file .comment.md
          gh issue close ${{ github.event.issue.number }}

      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "Claude couldn't finish this request. Check the Actions log for this run. <!-- site-edit:failed -->"
          gh issue close ${{ github.event.issue.number }}
