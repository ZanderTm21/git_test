# Runs Claude Code (on the Claude subscription, not API tokens) for each change request sent from the site editor.
# Claude only edits files under site/ and writes its reply; the steps after it commit, comment and close the issue.
name: Site edit

on:
  issues:
    types: [opened]

concurrency:
  group: site-edit
  cancel-in-progress: false

jobs:
  edit:
    # Only requests the editor created (labelled, opened by the repository owner's token).
    if: contains(github.event.issue.labels.*.name, 'site-edit') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-draft
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        run: |
          npm install -g @anthropic-ai/claude-code
          sudo /usr/bin/python3 -m pip install --quiet --break-system-packages pillow numpy
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf || sudo apt-get install -y -qq fonts-dejavu-core
          # Sandbox for Claude's Python: a separate user with access to the site files only (see tools/run_python.sh).
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin sitebox
          mkdir -p .work
          chmod -R a+rwX site .work
          chmod 700 .git
          sudo install -d -m 755 /opt/sitetools /opt/sitetools/bin
          sudo install -m 755 tools/run_python.sh /opt/sitetools/run_python.sh
          sudo install -m 644 tools/edit_image.py /opt/sitetools/edit_image.py
          for name in python3 python sitepy; do
            printf '#!/bin/sh\nexec /opt/sitetools/run_python.sh "$@"\n' | sudo tee /opt/sitetools/bin/$name > /dev/null
          done
          printf '#!/bin/sh\nexec /opt/sitetools/run_python.sh --tool /opt/sitetools/edit_image.py "$@"\n' | sudo tee /opt/sitetools/bin/siteimg > /dev/null
          # Everyday read/edit commands also run in the sandbox.
          for name in grep egrep head tail cat wc sort uniq cut tr sed awk find diff file ls mkdir cp mv rm touch stat du; do
            real="$(command -v $name)"
            printf '#!/bin/sh\nexec /opt/sitetools/run_python.sh --cmd %s "$@"\n' "$real" | sudo tee /opt/sitetools/bin/$name > /dev/null
            echo "$name" >> .work/sandboxed-commands
          done
          sudo chmod 755 /opt/sitetools/bin/*

      - name: Save the request
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > .request.md

      - name: Claude edits the site
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SITE_WORKSPACE: ${{ github.workspace }}
        run: |
          umask 0000  # files Claude writes stay editable by the Python sandbox
          export PATH="/opt/sitetools/bin:$PATH"  # Claude's commands go through the sandbox wrappers
          claude -p "Handle the change request in .request.md by following CLAUDE.md. Write your reply to the team member in .reply.md. Create scripts with the Write tool and run them with python3 in a separate Bash call; never use shell redirection or heredocs." \
            --allowedTools "Read" "Edit" "Write" "Bash(cd:*)" \
              "Bash(python3:*)" "Bash(python:*)" "Bash(sitepy:*)" "Bash(siteimg:*)" \
              "Bash(grep:*)" "Bash(egrep:*)" "Bash(head:*)" "Bash(tail:*)" "Bash(cat:*)" "Bash(wc:*)" \
              "Bash(sort:*)" "Bash(uniq:*)" "Bash(cut:*)" "Bash(tr:*)" "Bash(sed:*)" "Bash(awk:*)" \
              "Bash(find:*)" "Bash(diff:*)" "Bash(file:*)" "Bash(ls:*)" "Bash(mkdir:*)" "Bash(cp:*)" \
              "Bash(mv:*)" "Bash(rm:*)" "Bash(touch:*)" "Bash(stat:*)" "Bash(du:*)" \
            --disallowedTools "Read(//proc/**)" "Read(//sys/**)" "Read(//root/**)" "Read(//etc/**)" \
              "Read(~/.claude/**)" "Read(~/.claude.json)" "Read(~/.config/**)" \
            --permission-mode dontAsk \
            --no-session-persistence \
            --output-format stream-json --verbose > .claude-log.jsonl || touch .claude-failed
          test -s .reply.md || echo "Done." > .reply.md

      - name: Show what Claude did
        if: always()
        run: |
          # Each tool call and any refusal, so problems are visible in this log.
          jq -r 'select(.type=="assistant") | .message.content[]? | select(.type=="tool_use") | "TOOL  \(.name): \(.input.command // .input.file_path // .input.pattern // "" | tostring | .[0:200])"' .claude-log.jsonl || true
          jq -r 'select(.type=="user") | .message.content[]? | select(.type=="tool_result" and .is_error==true) | "ERROR \(.content | tostring | .[0:300])"' .claude-log.jsonl || true
          jq -r 'select(.type=="result") | "RESULT \(.subtype) turns=\(.num_turns) denials=\(.permission_denials | length)"' .claude-log.jsonl || true

      - name: Save the changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -f .claude-failed || { echo "Claude did not finish (see the log above)."; exit 1; }
          git config user.name "site-editor-bot"
          git config user.email "site-editor-bot@users.noreply.github.com"
          sudo chown -R "$(id -u):$(id -g)" site
          git add -A site
          if git diff --cached --quiet; then
            echo "No file changes."
          else
            git commit -m "Site edit #${{ github.event.issue.number }}"
            remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            # The editor may have synced the draft while Claude worked: put this edit on top of that and retry.
            for try in 1 2 3; do
              git push "$remote" HEAD:site-draft && exit 0
              git pull --rebase "$remote" site-draft
            done
            exit 1
          fi

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { cat .reply.md; printf '\n\n<!-- site-edit:done -->\n'; } > .comment.md
          gh issue comment ${{ github.event.issue.number }} --body-file .comment.md
          gh issue close ${{ github.event.issue.number }}

      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "Claude couldn't finish this request. Check the Actions log for this run. <!-- site-edit:failed -->"
          gh issue close ${{ github.event.issue.number }}
